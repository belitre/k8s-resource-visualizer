replicaCount: 1

image:
  repository: ghcr.io/belitre/k8s-resource-visualizer
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

clusterName: "unknown"
port: 8080
serveFrontend: true

# Frontend config — only used when serveFrontend=true.
# The local backend (this instance) is always included automatically.
frontend:
  # Optional hex color for this cluster in the UI.
  selfColor: ""
  # Additional backend clusters to pre-configure.
  backends: []
  # - url: "http://cluster-b.example.com"
  #   color: "#3b82f6"
  # Resources to auto-select in the filter when the app first loads.
  # Use "*" to match any version or resource within a group.
  # If not set, no resources are pre-selected and the user must select manually.
  defaultResources:
    - { group: "apps",                      version: "*", resource: "deployments"  }
    - { group: "apps",                      version: "*", resource: "statefulsets" }
    - { group: "apps",                      version: "*", resource: "daemonsets"   }
    - { group: "batch",                     version: "*", resource: "jobs"         }
    - { group: "batch",                     version: "*", resource: "cronjobs"     }
    - { group: "",                          version: "*", resource: "pods"         }
    - { group: "",                          version: "*", resource: "namespaces"   }
    - { group: "",                          version: "*", resource: "configmaps"   }
    - { group: "",                          version: "*", resource: "secrets"      }
    - { group: "",                          version: "*", resource: "services"     }
    - { group: "networking.k8s.io",         version: "*", resource: "ingresses"    }
    - { group: "gateway.networking.k8s.io", version: "*", resource: "httproutes"  }

# Optional backend resource/namespace filter.
# When set, a ConfigMap is created and mounted as the backend config file (CONFIG_PATH).
# By default everything is watched. Use include for allowlist mode, exclude to skip specific items.
backendConfig: {}
# resources:
#   include:   # if set, ONLY watch these
#     - group: "apps"
#       version: "v1"
#       resource: "deployments"
#     - group: ""
#       version: "v1"
#       resource: "pods"
#   exclude:   # always skipped, even if in include
#     - group: ""
#       version: "v1"
#       resource: "events"
# namespaces:
#   include: []  # if set, ONLY watch these namespaces
#   exclude:
#     - kube-system
# remoteBackends:  # other cluster backends this instance will proxy to
#   - name: cluster-b
#     url: http://k8s-resource-visualizer.default.svc.cluster.local:8080
#     color: "#f59e0b"  # optional hex color shown in the UI

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: k8s-resource-visualizer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: my-gateway
      namespace: default
  hostnames: []
  # - "events.example.com"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
