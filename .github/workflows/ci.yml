name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create frontend/dist placeholder for embed
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race ./...

  frontend:
    name: Frontend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25.8.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test
        run: npm test -- --run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  helm:
    name: Helm validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint helm/k8s-resource-visualizer

      - name: Template (defaults)
        run: helm template test helm/k8s-resource-visualizer

      - name: Template (with ingress)
        run: |
          helm template test helm/k8s-resource-visualizer \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix

      - name: Template (with httpRoute)
        run: |
          helm template test helm/k8s-resource-visualizer \
            --set httpRoute.enabled=true \
            --set httpRoute.hostnames[0]=events.example.com

      - name: Template (with backend config - exclude only)
        run: |
          helm template test helm/k8s-resource-visualizer \
            --set backendConfig.namespaces.exclude[0]=kube-system \
            --set backendConfig.resources.exclude[0].group="" \
            --set backendConfig.resources.exclude[0].version=v1 \
            --set backendConfig.resources.exclude[0].resource=events

      - name: Template (with backend config - include list, scoped ClusterRole)
        run: |
          helm template test helm/k8s-resource-visualizer \
            --set backendConfig.resources.include[0].group=apps \
            --set backendConfig.resources.include[0].version=v1 \
            --set backendConfig.resources.include[0].resource=deployments \
            --set backendConfig.resources.include[1].group="" \
            --set backendConfig.resources.include[1].version=v1 \
            --set backendConfig.resources.include[1].resource=pods

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: k8s-resource-visualizer:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
