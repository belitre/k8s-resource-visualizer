apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-resource-visualizer
  namespace: default
  labels:
    app: k8s-resource-visualizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-resource-visualizer
  template:
    metadata:
      labels:
        app: k8s-resource-visualizer
    spec:
      serviceAccountName: k8s-resource-visualizer
      containers:
        - name: k8s-resource-visualizer
          image: k8s-resource-visualizer:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "my-cluster"  # Change to your cluster name
            - name: PORT
              value: "8080"
            - name: SERVE_FRONTEND
              value: "true"  # Set to "false" on backend-only deployments
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-resource-visualizer
  namespace: default
  labels:
    app: k8s-resource-visualizer
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: k8s-resource-visualizer
