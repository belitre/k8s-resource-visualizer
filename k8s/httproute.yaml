apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-resource-visualizer
  namespace: default
spec:
  parentRefs:
    - name: my-gateway        # Change to your Gateway name
      namespace: default       # Change to your Gateway namespace
  hostnames:
    - "events.example.com"     # Change to your desired hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: k8s-resource-visualizer
          port: 80
